version: '3.8'

services:
  mysql-db:
    image: mysql:8.4
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: auto_project
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Uncomment if you want to initialize the DB with a sql script:
      - ./backend/auto_project.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: ./backend
    container_name: backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=mysql-db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=root123
      - DB_NAME=auto_project
      - PORT=5000
    env_file:
      - ./backend/.env
    depends_on:
      - mysql-db

  frontend:
    build: ./frontend
    container_name: autohallproject
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db_data:
