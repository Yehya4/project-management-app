
services:

  # ─── Base de données MySQL ──────────────────────────────────────────────────
  mysql-db:
    image: mysql:8.4
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-R00tStr0ng!2024}
      MYSQL_DATABASE: auto_project
      MYSQL_USER: appuser
      MYSQL_PASSWORD: ${DB_PASSWORD:-Aut0Pr0ject@S3cur3!2024}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./backend/auto_project.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "appuser", "--password=${DB_PASSWORD:-Aut0Pr0ject@S3cur3!2024}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─── Backend Node.js ────────────────────────────────────────────────────────
  backend:
    build: ./backend
    container_name: backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=mysql-db
      - DB_PORT=3306
      - DB_USER=appuser
      - DB_NAME=auto_project
      - PORT=5000
    env_file:
      - ./backend/.env
    depends_on:
      mysql-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─── Frontend React ─────────────────────────────────────────────────────────
  frontend:
    build: ./frontend
    container_name: autohallproject
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  # ─── Nginx — Reverse Proxy ──────────────────────────────────────────────────
  nginx:
    build: ./nginx
    container_name: nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    # volumes:
    #   - ./nginx/ssl:/etc/nginx/ssl:ro   # Décommenter pour HTTPS
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  db_data:
    driver: local
